<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Site Officiel</title>
    <meta name="description" content="Découvrez nos produits et prestations. Commandez facilement sur WhatsApp." />
    
    <!-- Open Graph / Réseaux sociaux & WhatsApp preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Site Officiel" />
    <meta property="og:description" content="Découvrez nos produits et prestations. Commandez facilement sur WhatsApp." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1536240478700-b869070f9279?auto=format&fit=crop&w=1200&q=80" />
    <meta property="og:site_name" content="Site Officiel" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Site Officiel" />
    <meta name="twitter:description" content="Découvrez nos produits et prestations. Commandez facilement sur WhatsApp." />

    <meta name="theme-color" content="#0B0E14" />
    
    <!-- PWA Web App Manifest & Mobile App Capabilities -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KTFA FLEX" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/icon-192.png" />

    <!-- Tailwind CDN for ultra-fast styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                gold: '#f59e0b',
                dark: '#0a0d14',
                card: '#121826'
              }
            },
            fontFamily: {
              outfit: ['Outfit', 'sans-serif'],
              inter: ['Inter', 'sans-serif']
            },
            keyframes: {
              wiggle: {
                '0%, 100%': { transform: 'rotate(-7deg)' },
                '50%': { transform: 'rotate(7deg)' },
              }
            },
            animation: {
              wiggle: 'wiggle 0.6s ease-in-out infinite',
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#07090e] text-white antialiased selection:bg-amber-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- ENREGISTREMENT OFFICIEL DU SERVICE WORKER PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('[PWA] Service Worker actif sur le périmètre :', reg.scope);
          }).catch(function(err) {
            console.warn('[PWA] Échec enregistrement SW :', err);
          });
        });
      }
    </script>
  </body>
</html>
