name = "market-place"
main = "worker/index.js"
compatibility_date = "2024-09-23"
account_id = "0c6536b2366b6a388b4d6a4d331d486e"

# Cloudflare Workers Static Assets (Front-end SPA Vite)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Cloudflare D1 Database dédiée
[[d1_databases]]
binding = "DB"
database_name = "market-place-db"
database_id = "fc9b2a42-ea23-4b3e-b464-804407d9bb92"

# Cloudflare R2 Storage (Vidéos, Affiches, Médias Uploadés)
[[r2_buckets]]
binding = "R2_STORAGE"
bucket_name = "digitalmarkpro-assets"

[vars]
ENVIRONMENT = "production"
ADMIN_KEY = "2026"
DEFAULT_WHATSAPP = "237694473414"
COMPANY_NAME = "MARKET PLACE"
